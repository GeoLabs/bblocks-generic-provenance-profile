identifier-prefix: ogc.bbr.provenance

name: OGC Building Blocks - Generic Provenance
abstract: Generic provenance profile aggregating W3C PROV, Wf4Ever and EOAP building blocks
description: |
  These OGC Building Blocks provide a generic **provenance profile** for the
  OSPD / EOAP context, built on top of the canonical
  [W3C PROV](https://www.w3.org/TR/prov-overview/) data model (PROV-DM / PROV-O).

  Rather than redefining PROV, this register **builds on** the W3C PROV JSON
  schema building block [`ogc.ogc-utils.prov`](https://ogcincubator.github.io/bblock-prov-schema/)
  and **aggregates** it with two complementary registers so they can be
  cross-referenced from a single place:

  - **[bblock-prov-schema](https://github.com/ogcincubator/bblock-prov-schema)**
    (`ogc.ogc-utils.prov*`) — the canonical W3C PROV-O Entity / Activity / Agent
    schemas that this register profiles.
  - **[bblocks-wf4ever](https://github.com/ogcincubator/bblocks-wf4ever)**
    (`ogc.bbr.wf4ever.*`) — workflow-level provenance (wfdesc / wfprov / ro),
    e.g. `wfprov:WorkflowRun`, for retrospective execution provenance.
  - **[bblocks-eoap-cct](https://github.com/ogcincubator/bblocks-eoap-cct)**
    (`eoap.cct.*`) — EOAP CWL custom types (STAC, GeoJSON, bbox) used to type the
    entities whose provenance is described.

  The register defines the three core PROV starting-point classes as thin
  profiles of the prov-schema sub-schemas, plus a provenance bundle:

  - **Entity** — profile of `ogc.ogc-utils.prov-entity`.
  - **Activity** — profile of `ogc.ogc-utils.prov-activity`.
  - **Agent** — profile of `ogc.ogc-utils.prov-agent`.
  - **Provenance (bundle)** — built on the `ogc.ogc-utils.prov` provenance chain.

baseURL: https://example.org/bblocks-provenance/
gitHubBaseURL: https://github.com/your-org/bblocks-provenance/
license: CC-BY-4.0

imports:
  - default
  - https://ogcincubator.github.io/bblock-prov-schema/build/register.json
  - https://ogcincubator.github.io/bblocks-wf4ever/build/register.json
  - https://ogcincubator.github.io/bblocks-eoap-cct/build/register.json

options:
  generateProfiles: true
